<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Oẳn Tù Tì V2</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                #1e1e1e;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: flex-start;
        }


        .container {

            width: 100%;

            max-width: 1200px;

            padding: 40px 30px;
        }


        h1 {

            margin: 0;

            text-align: center;

            font-size: 42px;

            letter-spacing: 1px;
        }


        .subtitle {

            margin-top: 10px;

            text-align: center;

            color: #aaa;

            font-size: 18px;
        }


        .player-section {

            margin: 30px auto;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;
        }


        .player-section label {

            font-size: 18px;

            font-weight: bold;
        }


        #playerName {

            width: 260px;

            padding: 12px 15px;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }


        .rooms-grid {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-top: 30px;
        }


        .room-card {

            min-height: 220px;

            background: #2b2b2b;

            border: 2px solid #444;

            border-radius: 14px;

            padding: 25px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            transition:
                transform 0.15s,
                border-color 0.15s;
        }


        .room-card:hover {

            transform:
                translateY(-3px);
        }


        .room-empty {

            border-color:
                #555;
        }


        .room-waiting {

            border-color:
                #f0b429;
        }


        .room-playing {

            border-color:
                #42a5f5;
        }


        .room-title {

            font-size: 26px;

            font-weight: bold;

            margin-bottom: 15px;
        }


        .room-count {

            font-size: 30px;

            margin-bottom: 10px;
        }


        .room-status {

            color: #aaa;

            font-size: 16px;

            margin-bottom: 20px;
        }


        .join-room-btn {

            width: 160px;

            padding: 11px 20px;

            border: none;

            border-radius: 8px;

            background: #42a5f5;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }


        .join-room-btn:hover {

            background: #1e88e5;
        }


        .join-room-btn:disabled {

            background: #555;

            color: #999;

            cursor: not-allowed;
        }


        .server-status {

            margin-top: 30px;

            text-align: center;

            color: #888;

            font-size: 14px;
        }


        .server-online {

            color: #66bb6a;
        }


        .server-offline {

            color: #ef5350;
        }


        @media (max-width: 800px) {

            .rooms-grid {

                grid-template-columns:
                    repeat(2, 1fr);
            }
        }


        @media (max-width: 550px) {

            .rooms-grid {

                grid-template-columns:
                    1fr;
            }


            .player-section {

                flex-direction: column;
            }
        }

    </style>

</head>


<body>

    <div class="container">


        <h1>
            OẲN TÙ TÌ V2
        </h1>


        <div class="subtitle">
            Chọn phòng để tham gia
        </div>


        <div class="player-section">

            <label for="playerName">
                Tên người chơi:
            </label>


            <input
                id="playerName"
                type="text"
                value="dang"
                maxlength="20"
                placeholder="Nhập tên"
            >

        </div>


        <div
            id="roomsContainer"
            class="rooms-grid"
        >
        </div>


        <div
            id="serverStatus"
            class="server-status"
        >
            Đang kết nối server...
        </div>

    </div>


    <script>

        const roomsContainer =
            document.getElementById(
                "roomsContainer"
            );


        const playerName =
            document.getElementById(
                "playerName"
            );


        const serverStatus =
            document.getElementById(
                "serverStatus"
            );


        /*
         * Lưu tên người chơi
         */

        const savedName =
            localStorage.getItem(
                "ottv2_name"
            );


        if (savedName) {

            playerName.value =
                savedName;
        }


        playerName.addEventListener(
            "input",
            () => {

                localStorage.setItem(
                    "ottv2_name",
                    playerName.value
                );
            }
        );


        /*
         * Tạo dữ liệu 6 room mặc định.
         */

        function createDefaultRooms() {

            const rooms = [];


            for (
                let i = 1;
                i <= 6;
                i++
            ) {

                rooms.push({

                    id:
                        `ROOM${i}`,

                    count: 0,

                    status:
                        "empty"
                });
            }


            return rooms;
        }


        /*
         * Hiển thị 6 room.
         */

        function renderRooms(
            rooms
        ) {

            roomsContainer.innerHTML =
                "";


            for (
                let i = 1;
                i <= 6;
                i++
            ) {

                let room =
                    rooms.find(
                        item =>
                            item.id ===
                            `ROOM${i}`
                    );


                /*
                 * Nếu server chưa gửi
                 * room nào thì vẫn hiện
                 * room trống.
                 */

                if (!room) {

                    room = {

                        id:
                            `ROOM${i}`,

                        count: 0,

                        status:
                            "empty"
                    };
                }


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "room-card";


                if (
                    room.count === 0
                ) {

                    card.classList.add(
                        "room-empty"
                    );

                } else if (
                    room.count === 1
                ) {

                    card.classList.add(
                        "room-waiting"
                    );

                } else {

                    card.classList.add(
                        "room-playing"
                    );
                }


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "room-title";


                title.textContent =
                    room.id.replace(
                        "ROOM",
                        "ROOM "
                    );


                const count =
                    document.createElement(
                        "div"
                    );


                count.className =
                    "room-count";


                count.textContent =
                    `👤 ${room.count}/2`;


                const status =
                    document.createElement(
                        "div"
                    );


                status.className =
                    "room-status";


                if (
                    room.count === 0
                ) {

                    status.textContent =
                        "Phòng trống";

                } else if (
                    room.count === 1
                ) {

                    status.textContent =
                        "Đang chờ người chơi";

                } else {

                    status.textContent =
                        "Đang chơi";
                }


                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "join-room-btn";


                if (
                    room.count < 2
                ) {

                    button.textContent =
                        "JOIN ROOM";


                    button.disabled =
                        false;


                    button.onclick =
                        function () {

                            let name =
                                playerName.value.trim();


                            if (!name) {

                                name =
                                    "Player";
                            }


                            localStorage.setItem(
                                "ottv2_name",
                                name
                            );


                            /*
                             * Vào game.
                             */

                            window.location.href =
                                `room.html?room=${room.id}&name=${encodeURIComponent(name)}`;
                        };

                } else {

                    button.textContent =
                        "ROOM FULL";


                    button.disabled =
                        true;
                }


                card.appendChild(
                    title
                );

                card.appendChild(
                    count
                );

                card.appendChild(
                    status
                );

                card.appendChild(
                    button
                );


                roomsContainer.appendChild(
                    card
                );
            }
        }


        /*
         * Lấy trạng thái room từ server.
         */

        async function loadRooms() {

            try {

                const response =
                    await fetch(
                        "/api/rooms",
                        {
                            cache:
                                "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Server error"
                    );
                }


                const data =
                    await response.json();


                renderRooms(
                    data.rooms
                );


                serverStatus.textContent =
                    "● Server đang hoạt động";


                serverStatus.className =
                    "server-status server-online";


            } catch (error) {

                console.error(
                    error
                );


                /*
                 * Server lỗi vẫn hiện
                 * 6 room trên màn hình.
                 */

                renderRooms(
                    createDefaultRooms()
                );


                serverStatus.textContent =
                    "● Không kết nối được server";


                serverStatus.className =
                    "server-status server-offline";
            }
        }


        /*
         * Hiển thị ngay 6 room.
         */

        renderRooms(
            createDefaultRooms()
        );


        /*
         * Sau đó lấy dữ liệu thật.
         */

        loadRooms();


        /*
         * Cập nhật số người
         * mỗi 1 giây.
         */

        setInterval(
            loadRooms,
            1000
        );

    </script>

</body>

</html>
