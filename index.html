<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oẳn Tù Tì v2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Oẳn Tù Tì v2 (OTTv2)</h1>
        
        <h2 id="turn-indicator">Lượt hiện tại: Player 1</h2>
        
        <!-- THÊM MỚI: Bảng đếm số lượng quân -->
        <div class="scoreboard">
            <div class="player-panel p1">
                <h3>Player 1 (Xanh)</h3>
                <div class="stats">
                    <span>👊: <span id="p1-rock">0</span></span>
                    <span>✋: <span id="p1-paper">0</span></span>
                    <span>✌️: <span id="p1-scissors">0</span></span>
                </div>
            </div>
            <div class="player-panel p2">
                <h3>Player 2 (Đỏ)</h3>
                <div class="stats">
                    <span>👊: <span id="p2-rock">0</span></span>
                    <span>✋: <span id="p2-paper">0</span></span>
                    <span>✌️: <span id="p2-scissors">0</span></span>
                </div>
            </div>
        </div>

        <!-- Bảng thông báo chiến thắng -->
        <div id="game-over-panel" class="hidden">
            <h2 id="winner-message"></h2>
            <p id="winner-reason"></p>
            <button id="restart-btn">Chơi lại</button>
        </div>
        
        <!-- Bàn cờ -->
        <div class="board-wrapper">
            <div id="game-board"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
