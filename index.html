<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oẳn Tù Tì v2 - Multiplayer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/playhtml@latest"></script>
</head>
<body>
    <div class="container">
        
        <div id="lobby-overlay" class="overlay">
            <div class="modal">
                <h2>🎮 Sảnh chờ OTTv2</h2>
                <div class="room-input-group">
                    <input type="text" id="room-id-input" placeholder="Nhập mã phòng (VD: ROOM123)" />
                </div>
                <div class="mode-buttons">
                    <button id="btn-create-room" class="btn btn-blue">TẠO PHÒNG (P1)</button>
                    <button id="btn-join-room" class="btn btn-orange">VÀO PHÒNG (P2)</button>
                </div>
                <p id="lobby-status" style="color: red; margin-top: 15px;"></p>
            </div>
        </div>

        <div id="mode-selection" class="overlay hidden">
            <div class="modal">
                <h2>Chọn cách bố trí quân</h2>
                <p>Bạn là Chủ phòng (Player 1).</p>
                <div class="mode-buttons">
                    <button id="btn-fixed" class="btn btn-blue">CỐ ĐỊNH</button>
                    <button id="btn-random" class="btn btn-orange">NGẪU NHIÊN</button>
                </div>
            </div>
        </div>

        <div id="waiting-overlay" class="overlay hidden">
            <div class="modal">
                <h2>Đang chờ đối thủ...</h2>
                <p>Mã phòng của bạn là: <strong id="display-room-id" style="color:#1877f2; font-size:20px;"></strong></p>
                <p>Hãy gửi mã này cho Player 2.</p>
            </div>
        </div>

        <div id="notification-overlay" class="overlay hidden">
            <div class="modal">
                <h3 class="notify-title">Thông báo</h3>
                <p id="notification-message" class="notify-text"></p>
                <button id="btn-close-notify" class="btn btn-blue">Đã hiểu</button>
            </div>
        </div>

        <h1>Oẳn Tù Tì v2 (OTTv2)</h1>
        
        <h3 id="role-indicator">Bạn là: Đang chờ...</h3>
        <h2 id="turn-indicator">Lượt hiện tại: Player 1</h2>
        
        <div class="scoreboard">
            <div class="player-panel p1">
                <h3>Player 1 (Xanh)</h3>
                <div class="stats">
                    <span>👊: <span id="p1-rock">0</span></span>
                    <span>✋: <span id="p1-paper">0</span></span>
                    <span>✌️: <span id="p1-scissors">0</span></span>
                </div>
            </div>
            <div class="player-panel p2">
                <h3>Player 2 (Hồng)</h3>
                <div class="stats">
                    <span>👊: <span id="p2-rock">0</span></span>
                    <span>✋: <span id="p2-paper">0</span></span>
                    <span>✌️: <span id="p2-scissors">0</span></span>
                </div>
            </div>
        </div>

        <!-- CẬP NHẬT: Thêm nút Chơi lại và Thoát phòng vào Game Over Panel -->
        <div id="game-over-panel" class="hidden">
            <h2 id="winner-message"></h2>
            <p id="winner-reason"></p>
            <div class="mode-buttons" style="margin-top: 15px;">
                <button id="btn-play-again" class="btn btn-blue">CHƠI LẠI</button>
                <button id="btn-exit-room" class="btn btn-orange">THOÁT PHÒNG</button>
            </div>
        </div>
        
        <div class="board-wrapper">
            <div id="game-board"></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
